<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="manifest.json">
    
    <title>Ambient Sound Mixer</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --accent-color: #38bdf8;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: linear-gradient(135deg, #0f172a, #1e1b4b);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 450px;
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        h1 {
            text-align: center;
            font-size: 1.8rem;
            margin-bottom: 24px;
            font-weight: 600;
            letter-spacing: -0.025em;
        }

        .track-section {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .track-title {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            margin-bottom: 12px;
            font-weight: 700;
            display: flex;
            justify-content: space-between;
        }

        .pan-badge {
            font-size: 0.75rem;
            color: var(--accent-color);
            background: rgba(56, 189, 248, 0.1);
            padding: 2px 8px;
            border-radius: 20px;
        }

        select {
            width: 100%;
            padding: 12px;
            background: #0f172a;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: var(--text-color);
            font-size: 1rem;
            margin-bottom: 12px;
            outline: none;
            appearance: none;
            -webkit-appearance: none;
        }

        .volume-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .volume-container span {
            font-size: 1.2rem;
            width: 24px;
            text-align: center;
        }

        input[type="range"] {
            flex: 1;
            accent-color: var(--accent-color);
            height: 6px;
            border-radius: 3px;
            outline: none;
        }

        .timer-section {
            margin-bottom: 24px;
        }

        .timer-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        .timer-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-color);
            padding: 10px 0;
            border-radius: 12px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .timer-btn.active {
            background: var(--accent-color);
            color: #000;
            font-weight: 600;
            border-color: var(--accent-color);
        }

        .countdown {
            text-align: center;
            font-size: 1.1rem;
            margin-top: 12px;
            color: var(--accent-color);
            font-variant-numeric: tabular-nums;
            height: 24px;
        }

        .main-controls {
            display: flex;
            justify-content: center;
        }

        .play-btn {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            border: none;
            background: var(--text-color);
            color: #0f172a;
            font-size: 1.8rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(255,255,255,0.2);
            transition: transform 0.2s, background-color 0.2s;
        }

        .play-btn:active {
            transform: scale(0.95);
        }

        .play-btn.playing {
            background: #ef4444;
            color: #fff;
            box-shadow: 0 4px 15px rgba(239, 68, 68, 0.4);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Atmosphere Mixer</h1>

        <div class="track-section">
            <div class="track-title">Track 1 <span class="pan-badge">Left Ear</span></div>
            <select id="track1-select">
                <option value="audio/mixkit-light-rain-loop-2393.wav">🌧️ Light Rain</option>
                <option value="audio/mixkit-heavy-storm-rain-loop-2400.wav">⛈️ Heavy Storm</option>
                <option value="audio/mixkit-thunderstorm-and-rain-loop-2402.wav">🌩️ Thunderstorm</option>
                <option value="audio/mixkit-water-flowing-ambience-loop-3126.wav">🌊 Flowing Water</option>
            </select>
            <div class="volume-container">
                <span>🔈</span>
                <input type="range" id="track1-volume" min="0" max="1" step="0.01" value="0.7">
                <span>🔊</span>
            </div>
        </div>

        <div class="track-section">
            <div class="track-title">Track 2 <span class="pan-badge">Right Ear</span></div>
            <select id="track2-select">
                <option value="audio/mixkit-water-flowing-ambience-loop-3126.wav">🌊 Flowing Water</option>
                <option value="audio/mixkit-light-rain-loop-2393.wav">🌧️ Light Rain</option>
                <option value="audio/mixkit-heavy-storm-rain-loop-2400.wav">⛈️ Heavy Storm</option>
                <option value="audio/mixkit-thunderstorm-and-rain-loop-2402.wav">🌩️ Thunderstorm</option>
            </select>
            <div class="volume-container">
                <span>🔈</span>
                <input type="range" id="track2-volume" min="0" max="1" step="0.01" value="0.5">
                <span>🔊</span>
            </div>
        </div>

        <div class="timer-section">
            <div class="track-title" style="justify-content: center;">Sleep Timer</div>
            <div class="timer-grid">
                <button class="timer-btn" data-time="5">5 Min</button>
                <button class="timer-btn" data-time="10">10 Min</button>
                <button class="timer-btn" data-time="30">30 Min</button>
                <button class="timer-btn active" data-time="∞">Inf</button>
            </div>
            <div class="countdown" id="countdown-display"></div>
        </div>

        <div class="main-controls">
            <button class="play-btn" id="master-play">▶</button>
        </div>
    </div>

    <audio id="audio1" loop crossorigin="anonymous"></audio>
    <audio id="audio2" loop crossorigin="anonymous"></audio>

    <script>

        // Register Service Worker for PWA installability
if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
            .then(reg => console.log('Service Worker registered!'))
            .catch(err => console.log('Service Worker failed: ', err));
    });
}
        const audio1 = document.getElementById('audio1');
        const audio2 = document.getElementById('audio2');
        
        const track1Select = document.getElementById('track1-select');
        const track2Select = document.getElementById('track2-select');
        
        const track1Vol = document.getElementById('track1-volume');
        const track2Vol = document.getElementById('track2-volume');
        
        const masterPlayBtn = document.getElementById('master-play');
        const timerButtons = document.querySelectorAll('.timer-btn');
        const countdownDisplay = document.getElementById('countdown-display');

        let isPlaying = false;
        let timerDuration = Infinity; 
        let timerId = null;
        let timeRemaining = 0;

        // Web Audio API context initialization flag
        let audioCtx = null;
        let panner1 = null;
        let panner2 = null;

        function initAudioContext() {
            if (audioCtx) return; // Already initialized

            // Create Web Audio Context
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();

            // Create source nodes from our audio tags
            const source1 = audioCtx.createMediaElementSource(audio1);
            const source2 = audioCtx.createMediaElementSource(audio2);

            // Create Stereo Panner Nodes
            panner1 = audioCtx.createStereoPanner();
            panner2 = audioCtx.createStereoPanner();

            // Set Pan Values: -0.6 (Mostly Left) and 0.6 (Mostly Right)
            // Using 0.6 instead of hard 1.0 keeps it sounding natural instead of completely isolating ears
            panner1.pan.value = -0.6;
            panner2.pan.value = 0.6;

            // Wire up Track 1: Source -> Panner -> Speakers
            source1.connect(panner1);
            panner1.connect(audioCtx.destination);

            // Wire up Track 2: Source -> Panner -> Speakers
            source2.connect(panner2);
            panner2.connect(audioCtx.destination);
        }

        function setSources() {
            if (!audio1.src || !audio1.src.includes(track1Select.value)) {
                audio1.src = track1Select.value;
            }
            if (!audio2.src || !audio2.src.includes(track2Select.value)) {
                audio2.src = track2Select.value;
            }
        }

        track1Select.addEventListener('change', () => {
            audio1.src = track1Select.value;
            if (isPlaying) audio1.play().catch(e => console.log(e));
        });

        track2Select.addEventListener('change', () => {
            audio2.src = track2Select.value;
            if (isPlaying) audio2.play().catch(e => console.log(e));
        });

        track1Vol.addEventListener('input', (e) => audio1.volume = e.target.value);
        track2Vol.addEventListener('input', (e) => audio2.volume = e.target.value);

        // Set initial volumes
        audio1.volume = track1Vol.value;
        audio2.volume = track2Vol.value;

        // Play/Pause Action
        masterPlayBtn.addEventListener('click', () => {
            // Mobile Web Audio Unlock
            initAudioContext();
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            if (isPlaying) {
                pauseApp();
            } else {
                setSources(); 
                playApp();
            }
        });

        function playApp() {
            isPlaying = true;
            masterPlayBtn.textContent = '⏸';
            masterPlayBtn.classList.add('playing');
            
            audio1.play().catch(err => console.log("Track 1 delayed:", err));
            audio2.play().catch(err => console.log("Track 2 delayed:", err));

            if (timerDuration !== Infinity) {
                if (timeRemaining <= 0) timeRemaining = timerDuration;
                startCountdown();
            }
        }

        function pauseApp() {
            isPlaying = false;
            masterPlayBtn.textContent = '▶';
            masterPlayBtn.classList.remove('playing');
            
            audio1.pause();
            audio2.pause();
            
            clearInterval(timerId);
        }

        // Timer Selection
        timerButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                timerButtons.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');

                const val = btn.getAttribute('data-time');
                if (val === '∞') {
                    timerDuration = Infinity;
                    timeRemaining = 0;
                    countdownDisplay.textContent = '';
                    clearInterval(timerId);
                } else {
                    timerDuration = parseInt(val) * 60;
                    timeRemaining = timerDuration;
                    if (isPlaying) {
                        startCountdown();
                    } else {
                        displayTime(timeRemaining);
                    }
                }
            });
        });

        function startCountdown() {
            clearInterval(timerId);
            displayTime(timeRemaining);
            
            timerId = setInterval(() => {
                timeRemaining--;
                displayTime(timeRemaining);

                if (timeRemaining <= 0) {
                    clearInterval(timerId);
                    pauseApp();
                    countdownDisplay.textContent = "Timer finished";
                }
            }, 1000);
        }

        function displayTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            countdownDisplay.textContent = `${mins}:${secs.toString().padStart(2, '0')}`;
        }
    </script>
</body>
</html>
