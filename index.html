<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atmosphere Mixer</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1a1a2e">
    <style>
        :root {
            --bg-color: #1a1a2e;
            --container-bg: #162447;
            --accent-color: #e43f5a;
            --text-color: #e2e8f0;
            --slider-bg: #1f4068;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .mixer-container {
            background-color: var(--container-bg);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 500px;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: var(--text-color);
            font-weight: 600;
            letter-spacing: 1px;
        }

        .track-control {
            background-color: rgba(255,255,255,0.05);
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
        }

        .track-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        label {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            opacity: 0.8;
        }

        select {
            background-color: var(--slider-bg);
            color: var(--text-color);
            border: none;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            outline: none;
            font-size: 0.9rem;
        }

        .control-group {
            margin-bottom: 15px;
        }

        .control-group:last-child {
            margin-bottom: 0;
        }

        .control-label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
            font-size: 0.85rem;
            opacity: 0.7;
        }

        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            height: 6px;
            background: var(--slider-bg);
            border-radius: 3px;
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            background: var(--accent-color);
            border-radius: 50%;
            cursor: pointer;
            transition: transform 0.1s;
        }

        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }

        .pan-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .pan-slider {
            flex-grow: 1;
        }

        .master-controls {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-top: 30px;
        }

        .btn-play {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 15px;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            box-shadow: 0 4px 15px rgba(228, 63, 90, 0.3);
        }

        .btn-play:hover {
            background-color: #ff4d6d;
        }

        .btn-play:active {
            transform: scale(0.98);
        }

        .timer-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: rgba(255,255,255,0.05);
            padding: 15px 20px;
            border-radius: 12px;
        }

        #timer-display {
            font-family: monospace;
            font-size: 1.1rem;
            color: var(--accent-color);
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="mixer-container">
        <h1>Atmosphere Mixer</h1>
        
        <div class="track-control">
            <div class="track-header">
                <label>Track 1</label>
                <select id="track1-select">
                    <option value="mixkit-forest-ambience-loop-1228.wav">Forest Ambience</option>
                    <option value="mixkit-forest-heavy-rain-loop-1226.wav">Forest Heavy Rain</option>
                    <option value="mixkit-forest-rain-loop-1225.wav">Forest Rain</option>
                    <option value="mixkit-strong-wind-loop-1174.wav">Strong Wind</option>
                    <option value="mixkit-wind-in-the-forest-loop-1233.wav">Wind in Forest</option>
                    <option value="mixkit-winter-wind-loop-1175.wav">Winter Wind</option>
                </select>
            </div>
            <div class="control-group">
                <div class="control-label"><span>Volume</span><span id="track1-vol-val">80%</span></div>
                <input type="range" id="track1-volume" min="0" max="1" step="0.01" value="0.8">
            </div>
            <div class="control-group">
                <div class="control-label"><span>Pan</span><span id="track1-pan-val">Center</span></div>
                <div class="pan-container">
                    <input type="range" id="track1-pan" class="pan-slider" min="-1" max="1" step="0.1" value="0">
                </div>
            </div>
        </div>

        <div class="track-control">
            <div class="track-header">
                <label>Track 2</label>
                <select id="track2-select">
                    <option value="mixkit-strong-wind-loop-1174.wav">Strong Wind</option>
                    <option value="mixkit-forest-ambience-loop-1228.wav">Forest Ambience</option>
                    <option value="mixkit-forest-heavy-rain-loop-1226.wav">Forest Heavy Rain</option>
                    <option value="mixkit-forest-rain-loop-1225.wav">Forest Rain</option>
                    <option value="mixkit-wind-in-the-forest-loop-1233.wav">Wind in Forest</option>
                    <option value="mixkit-winter-wind-loop-1175.wav">Winter Wind</option>
                </select>
            </div>
            <div class="control-group">
                <div class="control-label"><span>Volume</span><span id="track2-vol-val">50%</span></div>
                <input type="range" id="track2-volume" min="0" max="1" step="0.01" value="0.5">
            </div>
            <div class="control-group">
                <div class="control-label"><span>Pan</span><span id="track2-pan-val">Center</span></div>
                <div class="pan-container">
                    <input type="range" id="track2-pan" class="pan-slider" min="-1" max="1" step="0.1" value="0">
                </div>
            </div>
        </div>

        <div class="master-controls">
            <div class="timer-container">
                <label>Timer</label>
                <select id="timer-select">
                    <option value="0">Off</option>
                    <option value="15">15 Min</option>
                    <option value="30">30 Min</option>
                    <option value="45">45 Min</option>
                    <option value="60">60 Min</option>
                </select>
                <div id="timer-display" style="display: none;">--:--</div>
            </div>
            <button id="play-btn" class="btn-play">PLAY</button>
        </div>
    </div>

    <script>
        let audioCtx = null;
        let isPlaying = false;
        let timerInterval = null;
        let timeRemaining = 0;

        const tracks = {
            track1: { audio: null, source: null, gainNode: null, pannerNode: null, elementId: 'track1' },
            track2: { audio: null, source: null, gainNode: null, pannerNode: null, elementId: 'track2' }
        };

        function initAudio() {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            
            setupTrack('track1');
            setupTrack('track2');
            setupMediaSession();
        }

        function setupTrack(trackKey) {
            const track = tracks[trackKey];
            const select = document.getElementById(`${track.elementId}-select`);
            
            track.audio = new Audio(select.value);
            track.audio.loop = true;
            track.audio.crossOrigin = "anonymous";

            track.source = audioCtx.createMediaElementSource(track.audio);
            track.gainNode = audioCtx.createGain();
            
            if (audioCtx.createStereoPanner) {
                track.pannerNode = audioCtx.createStereoPanner();
            } else {
                track.pannerNode = audioCtx.createPanner();
                track.pannerNode.panningModel = 'HRTF';
            }

            track.source.connect(track.gainNode);
            track.gainNode.connect(track.pannerNode);
            track.pannerNode.connect(audioCtx.destination);

            const volSlider = document.getElementById(`${track.elementId}-volume`);
            track.gainNode.gain.value = volSlider.value;

            const panSlider = document.getElementById(`${track.elementId}-pan`);
            updatePanValue(track, parseFloat(panSlider.value));
        }

        function updatePanValue(track, val) {
            if (track.pannerNode.pan) {
                track.pannerNode.pan.value = val;
            } else {
                track.pannerNode.setPosition(val, 0, 1 - Math.abs(val));
            }
        }

        function setupEventListeners() {
            ['track1', 'track2'].forEach(id => {
                const trackKey = id;
                
                document.getElementById(`${id}-select`).addEventListener('change', (e) => {
                    if (tracks[trackKey].audio) {
                        const wasPlaying = !tracks[trackKey].audio.paused;
                        tracks[trackKey].audio.pause();
                        tracks[trackKey].audio.src = e.target.value;
                        if (wasPlaying && isPlaying) {
                            tracks[trackKey].audio.play().catch(err => console.log("Playback error on swap:", err));
                        }
                    }
                });

                document.getElementById(`${id}-volume`).addEventListener('input', (e) => {
                    const val = parseFloat(e.target.value);
                    document.getElementById(`${id}-vol-val`).textContent = `${Math.round(val * 100)}%`;
                    if (tracks[trackKey].gainNode) {
                        tracks[trackKey].gainNode.gain.value = val;
                    }
                });

                document.getElementById(`${id}-pan`).addEventListener('input', (e) => {
                    const val = parseFloat(e.target.value);
                    let label = 'Center';
                    if (val < 0) label = `Left ${Math.round(Math.abs(val) * 100)}%`;
                    if (val > 0) label = `Right ${Math.round(val * 100)}%`;
                    document.getElementById(`${id}-pan-val`).textContent = label;
                    
                    if (tracks[trackKey].pannerNode) {
                        updatePanValue(tracks[trackKey], val);
                    }
                });
            });

            document.getElementById('play-btn').addEventListener('click', togglePlayback);
            document.getElementById('timer-select').addEventListener('change', handleTimerSelect);
        }

        function togglePlayback() {
            if (!audioCtx) initAudio();

            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            const playBtn = document.getElementById('play-btn');

            if (!isPlaying) {
                tracks.track1.audio.play().catch(e => console.log(e));
                tracks.track2.audio.play().catch(e => console.log(e));
                playBtn.textContent = 'PAUSE';
                isPlaying = true;
                if (timeRemaining > 0) startTimerInterval();
                updateMediaSessionState("playing");
            } else {
                tracks.track1.audio.pause();
                tracks.track2.audio.pause();
                playBtn.textContent = 'PLAY';
                isPlaying = false;
                clearInterval(timerInterval);
                updateMediaSessionState("paused");
            }
        }

        function handleTimerSelect(e) {
            const minutes = parseInt(e.target.value);
            const display = document.getElementById('timer-display');
            clearInterval(timerInterval);

            if (minutes === 0) {
                timeRemaining = 0;
                display.style.display = 'none';
            } else {
                timeRemaining = minutes * 60;
                display.style.display = 'block';
                updateTimerDisplay();
                if (isPlaying) startTimerInterval();
            }
        }

        function startTimerInterval() {
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timeRemaining--;
                if (timeRemaining <= 0) {
                    clearInterval(timerInterval);
                    if (isPlaying) togglePlayback();
                    document.getElementById('timer-select').value = "0";
                    document.getElementById('timer-display').style.display = 'none';
                } else {
                    updateTimerDisplay();
                }
            }, 1000);
        }

        function updateTimerDisplay() {
            const mins = Math.floor(timeRemaining / 60);
            const secs = timeRemaining % 60;
            document.getElementById('timer-display').textContent = 
                `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }

        function setupMediaSession() {
            if ('mediaSession' in navigator) {
                navigator.mediaSession.metadata = new MediaMetadata({
                    title: 'Atmosphere Mixer',
                    artist: 'Ambient Soundscape',
                    album: 'Relaxation Mixer',
                    artwork: [
                        { src: 'icon.png', sizes: '512x512', type: 'image/png' }
                    ]
                });

                navigator.mediaSession.setActionHandler('play', () => { if (!isPlaying) togglePlayback(); });
                navigator.mediaSession.setActionHandler('pause', () => { if (isPlaying) togglePlayback(); });
            }
        }

        function updateMediaSessionState(state) {
            if ('mediaSession' in navigator) {
                navigator.mediaSession.playbackState = state;
            }
        }

        setupEventListeners();

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch(err => console.log('SW registration failed:', err));
            });
        }
    </script>
</body>
</html>
